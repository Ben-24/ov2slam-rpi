%YAML 1.0
---

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

Camera.topic_left: /cam1/image_raw
Camera.topic_right: /cam0/image_raw

Camera.model_left: pinhole
Camera.model_right: pinhole

Camera.left_nwidth: 800
Camera.left_nheight: 600
Camera.right_nwidth: 800
Camera.right_nheight: 600

Camera.fxl: 1240.693312
Camera.fyl: 1242.935090
Camera.cxl: 502.875929
Camera.cyl: 218.045056

Camera.k1l: 0.0639980828
Camera.k2l: -0.1030374162
Camera.p1l: -0.0229625505
Camera.p2l: -0.0059209159

Camera.fxr: 1242.482172
Camera.fyr: 1244.109997
Camera.cxr: 513.156169
Camera.cyr: 222.264871

Camera.k1r: 0.0182392817
Camera.k2r: 0.4558669783
Camera.p1r: -0.0230022984
Camera.p2r: -0.0046476242

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [1.0000000000, 0.0000000000, 0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000, 0.0000000000, 0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000, 0.0000000000, 0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.9999518676, -0.0068894817, 0.0069855238, 0.0295733040, 0.0069955405, 0.9998588795, -0.0152736224, 0.0000809720, -0.0068793107, 0.0153217547, 0.9998589495, 0.0011102240, 0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]

# Baseline: 2.96cm
# Stereo reprojection error: 1.0128px
# Note: cam1 is the physical left camera, cam0 is the physical right camera

#--------------------------------------------------------------------------------------------
# SLAM Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
debug: 1
log_timings: 0

mono: 0
stereo: 1

force_realtime: 0

# Estimator Mode
slam_mode: 1

# Loop Closing mode
buse_loop_closer: 1

# Stereo rectify or not
bdo_stereo_rect: 0
alpha: 0.

# Undist Image or not
bdo_undist: 0

# Init / KF px th.
finit_parallax: 5.

# Features Extractor
use_shi_tomasi: 0
use_fast: 0
use_brief: 1
use_singlescale_detector: 1

# Min dist between kps (define the number of kps)
nmaxdist: 35

# Features quality th.
nfast_th: 10
dmaxquality: 0.001 # used for gftt or singlescale

# Pre-processing
use_clahe: 1
fclahe_val: 3

# KLT related settings.
do_klt: 1
klt_use_prior: 1
btrack_keyframetoframe: 0
nklt_win_size: 9
nklt_pyr_lvl: 4

# Opencv Default: 30 iters. + 0.01 prec.
nmax_iter: 30
fmax_px_precision: 0.01

fmax_fbklt_dist: 2.0
nklt_err: 100.

# Matching th.
bdo_track_localmap: 1

fmax_desc_dist: 0.2 #0.35 # Ratio from desc size (for binary desc.) 
fmax_proj_pxdist: 2.

# Randomize RANSAC?
doepipolar: 1
dop3p : 0
bdo_random: 1
nransac_iter: 100
fransac_err: 10.

# Reproj err th.
fmax_reproj_err: 3.
buse_inv_depth: 1

# Ceres related parameters
robust_mono_th: 5.9915 # (20% : 3.2189 / 10% :  4.6052 / 5% : 5.9915 / 2%: 7.8240 / 1%: 9.2103)  

use_sparse_schur: 1
use_dogleg: 0
use_subspace_dogleg: 0
use_nonmonotic_step: 0

# Estimator parameters
apply_l2_after_robust: 1

nmin_covscore: 25 # Min co-obs for optimizing in SLAM mode BA

# Map Filtering
fkf_filtering_ratio: 0.95

# Final Pass
do_full_ba: 0